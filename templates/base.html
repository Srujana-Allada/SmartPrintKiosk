<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#21183f" />
    <title>{% block title %}SmartPrint Kiosk{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-document" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M5 14.5v4h14v-4"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19 13.5 1.2 1-.1 1.8-1.6 1-.2 1.6-1.6.8-1.4-.8-1.5.6-1.1 1.3-1.8-.4-.6-1.6-1.5-.6-1.7.2-1.2-1.3.5-1.6-.8-1.4.6-1.7 1.7-.3.8-1.4-.4-1.7 1.4-1.1 1.6.6 1.5-.7.5-1.6 1.8-.2 1 1.3 1.6.4 1.2-1 1.6.8-.1 1.8-1.2 1.1.3 1.6Z"/></symbol>
      <symbol id="icon-review" viewBox="0 0 24 24"><path d="M6 3.5h12v17H6zM9 8h6M9 12h6M9 16h4"/></symbol>
      <symbol id="icon-payment" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 9h16M7 14h3"/></symbol>
      <symbol id="icon-code" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h.01M12 8h.01M15 8h.01M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></symbol>
      <symbol id="icon-printer" viewBox="0 0 24 24"><path d="M7 9V4h10v5M6 18H4.5A1.5 1.5 0 0 1 3 16.5v-5A1.5 1.5 0 0 1 4.5 10h15a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H18"/><path d="M7 14h10v6H7zM17 12h.01"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="7" y="7" width="12" height="13" rx="1.5"/><path d="M16 7V5a1.5 1.5 0 0 0-1.5-1.5h-9A1.5 1.5 0 0 0 4 5v11a1.5 1.5 0 0 0 1.5 1.5H7"/></symbol>
      <symbol id="icon-color" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 10.5h.01M12 7.5h.01M15.5 10.5h.01M9.5 15.5a2.5 2.5 0 0 0 5 0c0-1.2-.8-1.6-2.5-1.6s-2.5-.4-2.5-1.6"/></symbol>
      <symbol id="icon-bw" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M7.5 12h9"/></symbol>
      <symbol id="icon-paper" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M14 3.5v4h4"/></symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></symbol>
      <symbol id="icon-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 15h2v2h-2zM19 15h1v5h-5v-2h3v-3h1z"/></symbol>
    </svg>
    <div class="page-shell">
      <header class="site-header">
        <div class="container">
          <a class="brand" href="/" aria-label="SmartPrint Kiosk home">
            <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#icon-printer"></use></svg></span>
            <span>SmartPrint Kiosk</span>
          </a>
        </div>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
      <footer class="site-footer">
        <p>SmartPrint Kiosk <span aria-hidden="true">·</span> Private, simple, ready when you are.</p>
      </footer>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
